# electron-builder config. The Python compute sidecar is frozen by PyInstaller
# (packaging/build_sidecar.py) into packaging/dist/vari-sidecar and shipped as
# an extra resource ("sidecar-bin"); the app spawns it at runtime.
appId: com.vari.app
productName: Vari
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: packaging/dist/vari-sidecar
    to: sidecar-bin
mac:
  category: public.app-category.education
  icon: build/icon.png
  identity: null # unsigned (CI has no cert); users right-click ▸ Open first run
  target:
    - dmg
    - zip
win:
  icon: build/icon.png
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target:
    - AppImage
