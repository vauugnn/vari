# electron-builder config. The Python compute sidecar is frozen by PyInstaller
# (packaging/build_sidecar.py) into packaging/dist/vari-sidecar and shipped as
# an extra resource ("sidecar-bin"); the app spawns it at runtime.
appId: com.vari.app
productName: Vari
directories:
  output: dist
  buildResources: build
afterPack: build/afterPack.js
files:
  - out/**/*
  - package.json
extraResources:
  - from: packaging/dist/vari-sidecar
    to: sidecar-bin
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Double-clicking these in Finder/Explorer opens them in Vari.
fileAssociations:
  - ext: sav
    name: SPSS Statistics Data
    role: Editor
  - ext: por
    name: SPSS Portable Data
    role: Editor
  - ext: dta
    name: Stata Data
    role: Editor
  - ext: csv
    name: CSV Data
    role: Editor
  - ext: spv
    name: Vari Output
    role: Editor
# electron-updater pulls new versions from GitHub Releases. This block makes
# electron-builder emit the latest*.yml update manifests alongside the
# installers; CI uploads them to the release.
publish:
  provider: github
  owner: vauugnn
  repo: vari
mac:
  category: public.app-category.education
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # When signing secrets (CSC_LINK) are present, electron-builder signs with the
  # Developer ID cert; when absent it skips signing and afterPack.js ad-hoc-signs
  # so Apple Silicon still runs the app. Notarization is enabled from CI via
  # --config.mac.notarize=true only when Apple credentials exist.
  target:
    - dmg
    - zip
win:
  icon: build/icon.png
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target:
    - AppImage
