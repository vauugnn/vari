# electron-builder config. Packaging is out of scope for Phase 0 (run via
# `npm run dev`); this exists so the build pipeline is defined from the start.
# The Python sidecar + venv are shipped as extra resources, unpacked from asar.
appId: com.vari.app
productName: Vari
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: sidecar
    to: sidecar
    filter: ["**/*.py"]
asarUnpack:
  - sidecar/**
mac:
  category: public.app-category.education
  icon: build/icon.png
  target:
    - dir
win:
  icon: build/icon.png
  target:
    - dir
linux:
  icon: build/icon.png
  target:
    - dir
