name: Build Vari

# Build the desktop app for macOS and Windows. Each OS runs on its own native
# runner: PyInstaller freezes that platform's Python sidecar, then
# electron-builder packages the installer. Artifacts are uploaded per run.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: vari-macos
          - os: windows-latest
            artifact: vari-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Freeze compute sidecar (PyInstaller)
        run: python packaging/build_sidecar.py

      - name: Install Node deps
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package app (electron-builder)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn
          retention-days: 14
