name: Build Vari

# Build the desktop app for macOS and Windows. Each OS runs on its own native
# runner: PyInstaller freezes that platform's Python sidecar, then
# electron-builder packages the installer. Artifacts are uploaded per run.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to publish Releases on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: vari-macos
          - os: windows-latest
            artifact: vari-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Freeze compute sidecar (PyInstaller)
        run: python packaging/build_sidecar.py

      - name: Install Node deps
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package app — macOS (sign + notarize if secrets present)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$CSC_LINK" ]; then
            echo "Signing + notarizing with Developer ID"
            npx electron-builder --mac --publish never --config.mac.notarize=true
          else
            echo "No Apple credentials — ad-hoc build"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package app — Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers (per-run artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      # On a version tag (e.g. v0.1.0), attach installers to a GitHub Release.
      # Each OS job appends its own files to the same release.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: true
